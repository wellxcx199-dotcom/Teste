l_english:
 rmt_sortear_destino_title:0 "Consultar o Destino"
 rmt_sortear_destino_desc:0 "Os conselheiros se reúnem para debater o próximo grande objetivo da nação. A sorte vai pôr algumas opções sobre a mesa, mas a escolha final é nossa."
 rmt_sortear_destino_tt:0 "Até três destinos serão sorteados de acordo com a região, a era e a situação do país. Você escolherá um deles."
 rmt_encerrar_capitulo_tt:0 "Este capítulo do destino termina. A decisão §YConsultar o Destino§! fica disponível de novo."
 rmt_ativar_ia_title:0 "Destinos para a IA: ligar"
 rmt_ativar_ia_desc:0 "Permite que países da IA com 150 ou mais de desenvolvimento também consultem o destino. Deixa o mundo mais imprevisível, mas pode deixar o jogo um pouco mais lento. A IA nunca recebe o destino de conquista."
 rmt_desativar_ia_title:0 "Destinos para a IA: desligar"
 rmt_desativar_ia_desc:0 "Impede que países da IA iniciem novos destinos. Os capítulos que já começaram continuam."

 rmt_eventos.1.t:0 "O Conselho do Destino"
 rmt_eventos.1.d:0 "Diante do mapa do mundo, nossos conselheiros apresentam os caminhos que parecem abertos para a nação. Cada um deles promete glória, e cada um exigirá anos de esforço. Qual seguiremos?"
 rmt_eventos.1.comercio:0 "Dominar o comércio da nossa terra."
 rmt_eventos.1.colonial:0 "Cruzar o oceano e fundar colônias."
 rmt_eventos.1.unificacao:0 "Unificar a nossa região sob uma só coroa."
 rmt_eventos.1.conquista:0 "Esmagar o vizinho que nos ameaça."
 rmt_eventos.1.fe:0 "Unir o povo numa só fé."
 rmt_eventos.1.suditos:0 "Construir uma rede de vassalos leais."
 rmt_eventos.1.nada:0 "Nenhum caminho nos atrai por ora."

 rmt_eventos.2.t:0 "O Futuro das Colônias"
 rmt_eventos.2.d:0 "Nossas colônias além-mar prosperam, e a corte se divide. Uns querem explorar as minas e enviar o ouro para casa. Outros querem fundar cidades onde nossa gente possa viver e prosperar."
 rmt_eventos.2.a:0 "Ouro! Que as minas trabalhem."
 rmt_eventos.2.b:0 "Cidades! Que nossa gente se estabeleça."

 rmt_comercio_1_title:0 "Mercadores da Terra"
 rmt_comercio_1_desc:0 "Controle ao menos 30% do comércio do seu nó comercial de origem."
 rmt_comercio_2_title:0 "Senhores do Mercado"
 rmt_comercio_2_desc:0 "Torne-se a maior potência comercial do seu nó de origem."
 rmt_comercio_3_title:0 "Monopólio"
 rmt_comercio_3_desc:0 "Controle 75% do comércio do seu nó de origem."

 rmt_colonial_1_title:0 "Além do Horizonte"
 rmt_colonial_1_desc:0 "Possua ao menos uma província nas Américas."
 rmt_colonial_2_title:0 "Colônias Florescentes"
 rmt_colonial_2_desc:0 "Possua 5 províncias nas Américas. Ao cumprir esta missão, você escolherá o rumo das colônias."
 rmt_ouro_1_title:0 "El Dorado"
 rmt_ouro_1_desc:0 "Possua 2 províncias produtoras de ouro fora da Europa."
 rmt_ouro_2_title:0 "Frotas do Tesouro"
 rmt_ouro_2_desc:0 "Possua 4 províncias produtoras de ouro fora da Europa e acumule 1000 ducados."
 rmt_povoamento_1_title:0 "Cidades no Novo Mundo"
 rmt_povoamento_1_desc:0 "Tenha 8 cidades (colônias completas) nas Américas."
 rmt_povoamento_2_title:0 "Uma Nova Pátria"
 rmt_povoamento_2_desc:0 "Tenha 10 cidades nas Américas com a cultura do seu país."

 rmt_unificacao_1_title:0 "Crescer em Poder"
 rmt_unificacao_1_desc:0 "Aumente o desenvolvimento total do país em 50 desde o início do jogo."
 rmt_unificacao_2_title:0 "Senhor da Região"
 rmt_unificacao_2_desc:0 "Domine boa parte da região que você está destinado a unificar."
 rmt_unificacao_3_title:0 "Uma Só Coroa"
 rmt_unificacao_3_desc:0 "Forme a grande nação da sua região."

 rmt_conquista_1_title:0 "Primeiro Golpe"
 rmt_conquista_1_desc:0 "Tome uma província do país escolhido como alvo. As províncias dele estão destacadas no mapa, e você já tem reivindicações sobre todas."
 rmt_conquista_2_title:0 "Avanço Implacável"
 rmt_conquista_2_desc:0 "Possua 3 províncias que pertenciam ao alvo."
 rmt_conquista_3_title:0 "Vitória Completa"
 rmt_conquista_3_desc:0 "Anexe o país alvo ou transforme-o em seu súdito."
 rmt_conquista_3_tt:0 "O país alvo deixou de existir ou é seu súdito."

 rmt_fe_1_title:0 "Fé Inabalável"
 rmt_fe_1_desc:0 "Alcance 80% de unidade religiosa."
 rmt_fe_2_title:0 "Uma Só Fé"
 rmt_fe_2_desc:0 "Alcance 100% de unidade religiosa."
 rmt_fe_3_title:0 "Reino Abençoado"
 rmt_fe_3_desc:0 "Mantenha 100% de unidade religiosa com estabilidade 3 e 50 de prestígio."

 rmt_suditos_1_title:0 "Primeiro Vassalo"
 rmt_suditos_1_desc:0 "Tenha ao menos um país súdito."
 rmt_suditos_2_title:0 "Rede de Lealdades"
 rmt_suditos_2_desc:0 "Tenha 2 países súditos."
 rmt_suditos_3_title:0 "Senhor de Senhores"
 rmt_suditos_3_desc:0 "Tenha 4 países súditos."

 rmt_mercadores_audazes:0 "Mercadores Audazes"
 rmt_febre_colonial:0 "Febre Colonial"
 rmt_ambicao_unificadora:0 "Ambição Unificadora"
 rmt_furia_conquistadora:0 "Fúria Conquistadora"
 rmt_zelo_religioso:0 "Zelo Religioso"
 rmt_rede_de_vassalos:0 "Rede de Vassalos"
 rmt_nacao_de_destino:0 "Nação Predestinada"
