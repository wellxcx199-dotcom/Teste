plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // Código do cliente (renderização, mixins visuais) separado do código comum/servidor.
    splitEnvironmentSourceSets()

    mods {
        climamod {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // O código usa os nomes oficiais da Mojang (ServerLevel, Commands, ...).
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

// Roda as simulações de demonstração do núcleo climático sem abrir o Minecraft.
tasks.register('demo', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.climate.core.Demo'
}
tasks.register('demo2', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'br.climate.core.Demo2'
}
